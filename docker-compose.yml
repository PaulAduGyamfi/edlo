name: edlo

# Postgres, Redis and MinIO stand in for RDS, SQS and S3, so the whole path
# the deployed system takes is rehearsed on a laptop.
x-app-env: &app-env
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://edlo:edlo@db:5432/edlo
  QUEUE_BACKEND: rq
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_BUCKET: edlo-media
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: edlo
      POSTGRES_PASSWORD: edlo
      POSTGRES_DB: edlo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edlo -d edlo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
                  mc mb --ignore-existing local/edlo-media"

  # Migrations run to completion before the API starts, as they do in the pipeline.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }

  api:
    build: .
    ports: ["8000:8000"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Two worker replicas locally, deliberately. One worker hides every
  # concurrency bug; two surface duplicate processing and lease races
  # immediately, on your laptop, where debugging is cheap.
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment: *app-env
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata: {}
