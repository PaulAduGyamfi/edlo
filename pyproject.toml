[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edlo"
version = "0.1.0" 
requires-python = ">=3.12"
dependencies = [
    "fastapi", "uvicorn[standard]", "pydantic-settings", 
    "sqlalchemy>=2", "alembic", "psycopg[binary]", 
    "python-multipart", "redis", "structlog",
    "openai", "boto3"
]

[project.optional-dependencies]
# The worker needs ffmpeg and half a gigabyte of Whisper weights. The API needs neither.
worker = ["faster-whisper"]
dev = [
    "faster-whisper",
    "pytest", "pytest-asyncio", "httpx", "fakeredis",
    "moto[s3,sqs]", "ruff", "mypy", "pytest-cov", "testcontainers[postgres]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP007", "UP035", "I001"]
"tests/*" = ["DTZ011"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps", "apps.api*", "apps.worker*", "edlo*"]
exclude = ["apps.web*", "tests*", "proof*", "evals*", "uploads*", "migrations*", "edlo*"]
namespaces = false