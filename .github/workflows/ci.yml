  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      CLUSTER: edlo-production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions
          aws-region: us-east-1

      # Record what is live NOW, so rollback has a target.
      - id: prev
        run: |
          echo "api=$(aws ecs describe-services --cluster $CLUSTER \
            --services edlo-api --query 'services[0].taskDefinition' \
            --output text)" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE=$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/edlo-api:${{ needs.build-push.outputs.tag }}

          TASK=$(aws ecs run-task --cluster $CLUSTER \
            --task-definition edlo-migrate --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.APP_SG }}]}" \
            --overrides '{"containerOverrides":[{"name":"migrate","image":"'"$IMAGE"'"}]}' \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks "$TASK"

          CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$CODE" != "0" ]; then
            aws logs tail /ecs/edlo-migrate --since 10m
            exit 1
          fi

      - name: Register new task definition and deploy
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE=$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/edlo-api:${{ needs.build-push.outputs.tag }}

          aws ecs describe-task-definition --task-definition edlo-api \
            --query taskDefinition > td.json

          jq --arg IMG "$IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' td.json > new-td.json

          NEW=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster $CLUSTER --service edlo-api \
            --task-definition "$NEW"

      - name: Wait for stability
        run: aws ecs wait services-stable --cluster $CLUSTER --services edlo-api

      - name: Post-deploy smoke
        run: |
          URL=http://$(aws elbv2 describe-load-balancers --names edlo-production \
            --query 'LoadBalancers[0].DNSName' --output text)
          curl -fsS "$URL/health"
          curl -fsS "$URL/version" | tee /tmp/v.json
          jq -e --arg S "${GITHUB_SHA:0:12}" '.commit | startswith($S)' /tmp/v.json

      - name: Roll back on failure
        if: failure()
        run: |
          aws ecs update-service --cluster $CLUSTER --service edlo-api \
            --task-definition ${{ steps.prev.outputs.api }}
          aws ecs wait services-stable --cluster $CLUSTER --services edlo-api
          echo "ROLLED BACK to ${{ steps.prev.outputs.api }}" >> $GITHUB_STEP_SUMMARY