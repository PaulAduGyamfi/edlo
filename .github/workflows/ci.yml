name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy edlo/

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=edlo --cov=apps
      - run: alembic upgrade head
      - name: Migrations must be reversible
        run: alembic downgrade -1 && alembic upgrade head

  build-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/edlo-api:${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      CLUSTER: edlo-production
      SERVICE: edlo-api
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions
          aws-region: us-east-1

      # Record what is live NOW, so rollback has a target.
      - id: prev
        run: |
          echo "api=$(aws ecs describe-services --cluster $CLUSTER \
            --services $SERVICE --query 'services[0].taskDefinition' \
            --output text)" >> $GITHUB_OUTPUT

      # Migrations run to completion BEFORE the service updates. Deploying
      # code that expects a column the database does not have breaks everything.
      - name: Run migrations
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE=$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/edlo-api:${{ needs.build-push.outputs.tag }}

          TASK=$(aws ecs run-task --cluster $CLUSTER \
            --task-definition edlo-migrate --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.APP_SG }}]}" \
            --overrides '{"containerOverrides":[{"name":"migrate","image":"'"$IMAGE"'"}]}' \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster $CLUSTER --tasks "$TASK"

          CODE=$(aws ecs describe-tasks --cluster $CLUSTER --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$CODE" != "0" ]; then
            aws logs tail /ecs/edlo-migrate --since 10m
            exit 1
          fi

      - name: Register new task definition and deploy
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE=$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/edlo-api:${{ needs.build-push.outputs.tag }}

          aws ecs describe-task-definition --task-definition edlo-api \
            --query taskDefinition > td.json

          jq --arg IMG "$IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' td.json > new-td.json

          NEW=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster $CLUSTER --service $SERVICE \
            --task-definition "$NEW"

      - name: Wait for stability
        run: aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE

      # Prove it works before declaring success.
      - name: Post-deploy smoke
        run: |
          URL=http://$(aws elbv2 describe-load-balancers --names edlo-production \
            --query 'LoadBalancers[0].DNSName' --output text)
          curl -fsS "$URL/health"
          curl -fsS "$URL/version" | tee /tmp/v.json
          jq -e --arg S "${GITHUB_SHA:0:12}" '.commit | startswith($S)' /tmp/v.json

      - name: Roll back on failure
        if: failure()
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE \
            --task-definition ${{ steps.prev.outputs.api }}
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
          echo "ROLLED BACK to ${{ steps.prev.outputs.api }}" >> $GITHUB_STEP_SUMMARY