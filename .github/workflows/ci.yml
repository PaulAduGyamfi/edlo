name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy edlo/

  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=edlo --cov=apps

  build-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - name: What is GitHub claiming
        run: |
          echo "repository: ${{ github.repository }}"
          echo "ref:        ${{ github.ref }}"
          echo "event:      ${{ github.event_name }}"
          echo "role:       arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions"

      - name: Inspect the OIDC token
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub,aud,iss}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/edlo-api:${{ steps.meta.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edlo-github-actions
          aws-region: us-east-1

      # Record what is live NOW, so rollback has a target.
      - id: prev
        run: |
          echo "api=$(aws ecs describe-services --cluster edlo-production \
            --services edlo-api --query 'services[0].taskDefinition' \
            --output text)" >> $GITHUB_OUTPUT

      - name: Register new task definition and deploy
        run: |
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE=$ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/edlo-api:${{ needs.build-push.outputs.tag }}

          aws ecs describe-task-definition --task-definition edlo-api \
            --query taskDefinition > td.json

          jq --arg IMG "$IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' td.json > new-td.json

          NEW=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster edlo-production --service edlo-api \
            --task-definition "$NEW"

      - name: Wait for stability
        run: aws ecs wait services-stable --cluster edlo-production --services edlo-api

      - name: Post-deploy smoke
        run: |
          URL=http://$(aws elbv2 describe-load-balancers --names edlo-production \
            --query 'LoadBalancers[0].DNSName' --output text)
          curl -fsS "$URL/health"
          curl -fsS "$URL/version" | tee /tmp/v.json
          jq -e --arg S "${GITHUB_SHA:0:12}" '.commit | startswith($S)' /tmp/v.json

      - name: Roll back on failure
        if: failure()
        run: |
          aws ecs update-service --cluster edlo-production --service edlo-api \
            --task-definition ${{ steps.prev.outputs.api }}
          aws ecs wait services-stable --cluster edlo-production --services edlo-api
          echo "ROLLED BACK to ${{ steps.prev.outputs.api }}" >> $GITHUB_STEP_SUMMARY